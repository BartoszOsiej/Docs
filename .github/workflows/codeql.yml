name: codeql

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 12 * * 3"

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8
        with: { language: "${{ matrix.language }}" }
      - uses: github/codeql-action/autobuild@6d786de4d6f3531a740e445b53a42b622bbbace8
      - uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85
